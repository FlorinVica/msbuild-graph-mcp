name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        dotnet-version: ['8.0.x', '9.0.x']

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore
      run: dotnet restore src/MsBuildGraphMcp/MsBuildGraphMcp.csproj

    - name: Build
      run: dotnet build src/MsBuildGraphMcp/MsBuildGraphMcp.csproj -c Release --no-restore

    - name: Test
      run: dotnet test tests/MsBuildGraphMcp.Tests/MsBuildGraphMcp.Tests.csproj --verbosity normal --logger "trx;LogFileName=results.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.dotnet-version }}
        path: '**/*.trx'

    - name: Pack
      run: dotnet pack src/MsBuildGraphMcp/MsBuildGraphMcp.csproj -c Release --no-build
